
parameters:
    # Web server of the test app: FrankenPHP serves tests/public on port 80 (SERVER_ROOT)
    env(SPLASH_HOST): 'http://localhost'

splash:
    ################################################################################
    # List of Available Connector Connections
    ################################################################################
    connections:

        ########################################################################
        # Soap Server
        soap:
            id:                 ThisIsSoapWsId
            key:                ThisIsNotASecretKeyForSoap
            name:               Server 1 (Soap)
            host:               "%env(SPLASH_HOST)%/ws/splash"
            server_host:        "%env(SPLASH_HOST)%"
            connector:          soap
            config:
                Extended:           true
                WsIdentifier:       ThisIsFakerWsId
                WsEncryptionKey:    ThisIsNotASecretKeyForFaker
                WsHost:             "%env(SPLASH_HOST)%"
                WsPath:             /ws/splash
                HttpAuth:           true
                HttpUser:           PhpUnit
                HttpPassword:       PhpUnitPwd

        ########################################################################
        # Faker Server
        faker:
            id:                 ThisIsFakerWsId
            key:                ThisIsNotASecretKeyForFaker
            name:               Server 2 (Faker)
            host:               "%env(SPLASH_HOST)%/ws/soap"
            server_host:        "%env(SPLASH_HOST)%"

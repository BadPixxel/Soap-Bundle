################################################################################
# Docker Compose File
#
# Local environment for the development and the tests of the Soap Bundle,
# one container per Symfony version, PHP versions from 8.2 to 8.5.
# FrankenPHP serves the test app (SERVER_ROOT) on port 80 of each container.
#
# You can add hosts to /etc/hosts
#
#    172.116.0.10       app.soap-bundle.local
#    172.116.0.74       sf7.soap-bundle.local
#    172.116.0.64       sf6.soap-bundle.local
#    172.116.0.54       sf5.soap-bundle.local
#
################################################################################

name: splash_soap_bundle

include:
    - docker/app.yaml
    - docker/symfony-7.yaml
    - docker/symfony-6.yaml
    - docker/symfony-5.yaml

networks:
    ################################################################################
    # Default Private Network
    default:
        driver: bridge
        ipam:
            config:
                - subnet: 172.116.0.0/24

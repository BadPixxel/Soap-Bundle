################################################################
# Include Pipeline Templates
include:
    - remote: 'https://raw.githubusercontent.com/BadPixxel/Php-Sdk/3.0/gitlab/php/defaults.yaml'
    - remote: 'https://raw.githubusercontent.com/BadPixxel/Php-Sdk/3.0/gitlab/pages.yaml'
    - remote: 'https://raw.githubusercontent.com/BadPixxel/Php-Sdk/3.0/gitlab/manifest.yaml'

################################################################
# Defined Pipeline Stages
stages:
    - Symfony-5
    - Symfony-6
    - Symfony-7
    - Builds

################################################################
# Web server of the test app: the FrankenPHP images serve
# SERVER_ROOT on port 80 from their entrypoint, no Symfony CLI
variables:
    SERVER_ROOT:        $CI_PROJECT_DIR/tests/public

################################################################
# Quality & functional tests of one Symfony / PHP pair
#
# SDK v3 `.functional` brings composer update, the junit report and
# the retry; statistics are displayed at the end of each job.
.tests:     &tests
    extends:    .functional
    script:
        # Execute Grumphp Testsuite
        - wall-e grumphp:quality
        - wall-e grumphp:stan
        # Execute PhpUnit Tests
        - php vendor/bin/phpunit --log-junit $CI_PROJECT_DIR/full-report.xml
    after_script:
        - make stats

################################################################
# Tests on Symfony 7
################################################################

sf7:php-8.5:
    <<: *tests
    image:      registry.gitlab.com/badpixxel-projects/php-sdk:php-8.5
    stage:      Symfony-7
    variables:
        SYMFONY_REQUIRE:    7.4.*

sf7:php-8.4:
    <<: *tests
    image:      registry.gitlab.com/badpixxel-projects/php-sdk:php-8.4
    stage:      Symfony-7
    variables:
        SYMFONY_REQUIRE:    7.4.*

sf7:php-8.3:
    <<: *tests
    image:      registry.gitlab.com/badpixxel-projects/php-sdk:php-8.3
    stage:      Symfony-7
    variables:
        SYMFONY_REQUIRE:    7.4.*

sf7:php-8.2:
    <<: *tests
    image:      registry.gitlab.com/badpixxel-projects/php-sdk:php-8.2
    stage:      Symfony-7
    variables:
        SYMFONY_REQUIRE:    7.4.*

################################################################
# Tests on Symfony 6
################################################################

sf6:php-8.3:
    <<: *tests
    image:      registry.gitlab.com/badpixxel-projects/php-sdk:php-8.3
    stage:      Symfony-6
    variables:
        SYMFONY_REQUIRE:    6.4.*

sf6:php-8.2:
    <<: *tests
    image:      registry.gitlab.com/badpixxel-projects/php-sdk:php-8.2
    stage:      Symfony-6
    variables:
        SYMFONY_REQUIRE:    6.4.*

################################################################
# Tests on Symfony 5
################################################################

sf5:php-8.2:
    <<: *tests
    image:      registry.gitlab.com/badpixxel-projects/php-sdk:php-8.2
    stage:      Symfony-5
    variables:
        SYMFONY_REQUIRE:    5.4.*

################################################################
# Build Documentation
################################################################

pages:
    when: manual

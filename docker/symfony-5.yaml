services:

    ################################################################################
    # Symfony 5 + PHP 8.2
    sf5:
        image:          registry.gitlab.com/badpixxel-projects/php-sdk:php-8.2
        container_name: sf5.soap-bundle.local
        hostname:       sf5.soap-bundle.local
        environment:
            SYMFONY_REQUIRE:        5.4.*
            COMPOSER_ROOT_VERSION:  3.0.x-dev
            COMPOSER_CACHE_DIR:     /tmp/composer-cache
            SERVER_ROOT:            /var/www/html/tests/public
        volumes:
            - ../:/var/www/html
            - sf5-var:/var/www/html/var
            - sf5-vendor:/var/www/html/vendor
            - ${HOME}/.cache/composer:/tmp/composer-cache
        networks:
            default:        { ipv4_address: 172.116.0.54, aliases: [ sf5.soap-bundle.local ] }

volumes:
    sf5-var:        ~
    sf5-vendor:     ~

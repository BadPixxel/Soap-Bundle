services:

    ################################################################################
    # Develop Image: Symfony 7 + PHP 8.5
    app:
        image:          registry.gitlab.com/badpixxel-projects/php-sdk:php-8.5
        container_name: app.soap-bundle.local
        hostname:       app.soap-bundle.local
        tty:            true
        environment:
            SYMFONY_REQUIRE:        7.4.*
            COMPOSER_ROOT_VERSION:  3.0.x-dev
            COMPOSER_CACHE_DIR:     /tmp/composer-cache
            SERVER_ROOT:            /var/www/html/tests/public
        volumes:
            - ../:/var/www/html
            - app-var:/var/www/html/var
            - app-vendor:/var/www/html/vendor
            - ${HOME}/.cache/composer:/tmp/composer-cache
        networks:
            default:        { ipv4_address: 172.116.0.10, aliases: [ app.soap-bundle.local ] }

volumes:
    app-var:        ~
    app-vendor:     ~
